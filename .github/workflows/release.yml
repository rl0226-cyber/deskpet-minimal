name: Build Windows exe

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run dist
      - run: Compress-Archive -Path dist/DeskPet-win32-x64 -DestinationPath "dist/DeskPet-${{ github.ref_name }}-win32-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
